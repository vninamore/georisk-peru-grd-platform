name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e './backend[dev]'
      - name: Lint
        run: ruff check backend/app backend/tests
      - name: Type check
        working-directory: backend
        run: mypy app
      - name: Test
        working-directory: backend
        run: python -m unittest discover -s tests -v

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ./pipeline
      - name: Test ETL
        env:
          PYTHONPATH: pipeline/src
        run: python -m unittest discover -s pipeline/tests -v
      - name: Validate sample GeoJSON
        run: georisk-etl data/sample/risk_scenarios.geojson

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: georisk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply database scripts
        env:
          PGPASSWORD: postgres
        run: for file in database/init/*.sql; do psql -h localhost -U postgres -d georisk_test -v ON_ERROR_STOP=1 -f "$file"; done
      - name: Smoke test functions
        env:
          PGPASSWORD: postgres
        run: test "$(psql -h localhost -U postgres -d georisk_test -Atc "SELECT georisk.classify_risk(0.51)")" = "very_high"
